tools:
  # ─────────────────────────── Core tools ───────────────────────────

  - name: clarify
    description: >
      Ask the user one precise follow-up question when required information is
      missing or when an external action requires confirmation. This tool must
      be called instead of guessing, inventing, or silently filling missing
      values. Use response_type="text" when requesting missing information such
      as an account handle, URL, DOI, identifier, topic, or other required
      argument. Use response_type="yes_no" when asking for explicit confirmation
      before sending, posting, publishing, deleting, booking, or changing
      external state. Do not merely write a question in normal assistant text
      when a structured clarification tool call is required.
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: "One concise question asking only for the missing information or confirmation."
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: >
            Use text for missing information. Use yes_no for explicit
            confirmation before an external side effect. Use choice only when
            the user must select from provided options.
        options:
          type: array
          default: []
          items:
            type: string
          description: "Choices shown only when response_type is choice."
      required: [question]

  - name: timeline
    description: >
      Fetch recent posts/tweets FROM a specific Twitter/X account by handle.
      Use when the user asks about posts BY a specific person or organization.
      ALWAYS map full names to handles: Boston Dynamics→BostonDynamics,
      Elon Musk→elonmusk, Andrej Karpathy→karpathy, Figure AI→figure_ai,
      Agility Robotics→AgilityRobotics, Yann LeCun→ylecun.
      DO NOT use for searching by topic — use social_search instead.
      If handle is unknown, call clarify first.
    parameters:
      type: object
      properties:
        screenname:
          type: string
          default: ""
          description: "Twitter handle without @. Example: BostonDynamics, elonmusk."
        limit:
          type: integer
          default: 5
          description: "Number of tweets to return. Extract from user request (e.g. '10 tweets' → 10)."
      required: [screenname]

  - name: social_search
    description: >
      Search social-media posts by topic or keyword. Use for requests asking
      what people are saying, discussing, or posting about a subject. Use
      search_type="Top" for popular or top posts and "Latest" for recent posts.
      Do not use for posts from one specific account. In multi-turn
      conversations, do not call this tool if the latest user instruction says
      to stop, remove, ignore, or switch away from Twitter or social media.
      A newer source instruction overrides an older social-search request.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Topic or keyword from the latest active user request."
        search_type:
          type: string
          enum: [Latest, Top]
          default: "Latest"
          description: "Top for popular posts; Latest for recent posts."
        limit:
          type: integer
          default: 5
          description: "Number of posts requested."
      required: [query]

  - name: lookup
    description: >
      Search the public web for research information or current news. Use
      topic="news" for news requests. Map "today" to timeframe="day", "this
      week" to "week", "this month" to "month", and "this year" to "year".
      Use this tool when the latest user instruction switches from Twitter or
      social media to web search. If the user says to drop, remove, or stop
      Twitter, call lookup only and do not retain the older social_search call.
      Do not use when the user already provides an exact URL; use fetch instead.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "The current research topic from the latest active request."
        topic:
          type: string
          enum: [general, news]
          default: "general"
          description: "Use news for current events and general for broader web research."
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: "week"
          description: "Time range explicitly requested or implied by today/week/month/year."
        max_results:
          type: integer
          default: 5
          description: "Maximum number of search results."
      required: [query]

  - name: fetch
    description: >
      Read or scrape one exact URL explicitly provided by the user. Use when the
      user asks to read, inspect, summarize, or analyze a specific link. Never
      invent, infer, substitute, or fabricate a URL. In particular, never use
      placeholder URLs such as example.com. If the user refers to "this
      article", "this page", or "this link" without providing a URL, call
      clarify with response_type="text" instead.
    parameters:
      type: object
      properties:
        url:
          type: string
          default: ""
          description: "The exact URL explicitly provided by the user."
      required: [url]

  - name: format
    description: >
      Format a list of collected items into a structured markdown digest or newsletter.
      Use ONLY after you have already collected items from lookup/fetch/social_search/papers.
      DO NOT use to search for more information.
      Templates: 'brief'=short bullets, 'sections'=grouped by topic, 'bullets'=plain list,
      'thread'=numbered thread, 'daily_ai_vn'=Vietnamese daily digest format.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "List of items from previous tool calls."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template:
          type: string
          enum: [brief, sections, bullets, thread, daily_ai_vn]
          default: "sections"
          description: "Output format template."
        headline:
          type: string
          default: ""
          description: "Optional headline for the digest."
      required: [items, template]

  # ─────────────────── Bonus / Optional tools ───────────────────────

  - name: send
    description: >
      Send a text message to a Telegram channel.
      ALWAYS call clarify(response_type='yes_no') BEFORE calling this tool.
      NEVER call send with confirmed=true on the first request — always confirm first.
      Only set confirmed=true after the user explicitly says yes.
    parameters:
      type: object
      properties:
        text:
          type: string
          default: ""
          description: "Message content to send."
        confirmed:
          type: boolean
          default: false
          description: "Must be true only after user has confirmed via clarify(yes_no)."
      required: [text]

  - name: policy
    description: >
      Search the internal company policy documents.
      Use when user explicitly asks about company rules, guidelines, or policies.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Policy query."
        policy_area:
          type: string
          enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage]
          default: "all"
          description: "Policy category to narrow search."
        top_k:
          type: integer
          default: 3
          description: "Number of policy sections to return."
      required: [query]

  - name: papers
    description: >
      Search arXiv for academic research papers on robotics topics.
      Use when user asks for research papers, preprints, academic studies on
      robotics, SLAM, motion planning, manipulation, drone navigation, etc.
      sort_by='submittedDate' for newest papers; 'relevance' for most relevant.
      No API key required — arXiv is free.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Search terms. Example: 'humanoid robot locomotion', 'SLAM outdoor environments'."
        max_results:
          type: integer
          default: 5
          description: "Number of papers to return."
        sort_by:
          type: string
          enum: [relevance, lastUpdatedDate, submittedDate]
          default: "relevance"
          description: "'submittedDate' for newest; 'relevance' for best match."
      required: [query]

  - name: paper_text
    description: >
      Download a specific arXiv paper PDF and extract its text content.
      Use when the user provides an arXiv ID (e.g. 1706.03762) and wants to read it.
      Requires pypdf installed.
    parameters:
      type: object
      properties:
        arxiv_url:
          type: string
          default: ""
          description: "arXiv paper ID (e.g. '2301.12345') or full arXiv URL."
        max_pages:
          type: integer
          default: 5
          description: "Number of pages to extract."
        max_chars:
          type: integer
          default: 8000
          description: "Maximum characters to return."
      required: [arxiv_url]

  # ─────────────────── NEW tools (team-built) ───────────────────────

  - name: robotics_companies
    description: >
      Look up information about well-known robotics companies from a local database.
      Use when user asks 'what companies make humanoid robots', 'tell me about
      Boston Dynamics', 'which companies are working on robot arms', etc.
      Supports filtering by robot type: humanoid, quadruped, arm, drone, logistics.
      No API key required — local data.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Company name or robot type to search. Example: 'humanoid', 'Boston Dynamics', 'drone'."
        robot_type:
          type: string
          enum: [all, humanoid, quadruped, arm, drone, logistics, mobile]
          default: "all"
          description: "Filter by robot category."
        limit:
          type: integer
          default: 5
          description: "Number of companies to return."
      required: []

  - name: robot_specs
    description: >
      Look up technical specifications of well-known robot models from a local database.
      Use when user asks about specs, capabilities, weight, speed, sensors of a specific robot.
      Example: 'Atlas specs', 'how fast can Spot run', 'Optimus robot specs'.
      No API key required — local data.
    parameters:
      type: object
      properties:
        robot_name:
          type: string
          default: ""
          description: "Robot model name. Example: 'Atlas', 'Spot', 'Optimus', 'H1', 'Figure 01'."
        spec_category:
          type: string
          enum: [all, physical, mobility, sensors, power, software]
          default: "all"
          description: "Category of specs to return."
      required: []

  - name: export_report
    description: "Xuất bản báo cáo nghiên cứu hoặc bản tin digest ra file báo cáo cục bộ (.md hoặc .txt)."
    parameters:
      type: object
      properties:
        title: {type: string, default: "", description: "Tiêu đề báo cáo"}
        content: {type: string, default: "", description: "Nội dung báo cáo dạng markdown hoặc text"}
        file_format: {type: string, enum: [markdown, txt], default: "markdown", description: "Định dạng file xuất ra"}
      required: [title, content]

  - name: stock_quote
    description: "Tra cứu giá cổ phiếu, thông tin tài chính và biến động giá theo mã chứng khoán (như AAPL, NVDA, TSLA, FPT, VNM)."
    parameters:
      type: object
      properties:
        symbol: {type: string, default: "", description: "Mã chứng khoán / mã cổ phiếu"}
        currency: {type: string, enum: [USD, VND], default: "USD", description: "Đơn vị tiền tệ"}
      required: [symbol]

  - name: translate
    description: "Dịch nội dung hoặc bài viết digest sang ngôn ngữ chỉ định (như Vietnamese, English, French)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Văn bản cần dịch"}
        target_language: {type: string, default: "Vietnamese", description: "Ngôn ngữ đích"}
      required: [text]

  - name: robotics_paper_lookup
    description: >
      Look up academic publication metadata from Crossref by DOI, DOI URL, title, author, or keyword.
      Use when the user provides a DOI, a DOI URL, asks for metadata of a paper title, or wants publication info (authors, venue, citation count).
      Do NOT use for arXiv IDs (use paper_text or papers instead).
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "DOI (e.g. 10.1109/LRA.2023.1234567), DOI URL, paper title, author, or keyword."
        lookup_type:
          type: string
          enum: [auto, doi, keyword]
          default: "auto"
          description: "'doi' for exact DOI search; 'keyword' for bibliographic search; 'auto' to auto-detect."
        max_results:
          type: integer
          default: 5
          description: "Maximum number of search results (1-10)."
      required: [query]
